name: Comparator (openai/math)
# Runs leanprover/comparator on one of openai/math's ComparatorChallenges configs at a pinned
# commit, following lean/ComparatorChallenges/README.md, except that `lake update` is NOT run:
# the committed lake-manifest.json is used as is. Then prints axioms and scans the import
# closure of the solution module. Optionally repeats the check with the nanoda kernel.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "openai/math commit (full SHA)"
        required: true
        default: "1581d4cbdd69a0faf34b2089614fe2a814316a6a"
      config:
        description: "Comparator config, relative to lean/"
        required: true
        default: "ComparatorChallenges/SiegelZeros.json"
      nanoda:
        description: "Also run Comparator with enable_nanoda=true (second kernel)"
        type: boolean
        default: true
permissions:
  contents: read
env:
  # Pins for the checking tools. Comparator v4.34.0 (d03acab) pins lean4export 076e8e5 (= its v4.34.0 tag).
  COMPARATOR_REV: d03acab154d269c06e60e4de7e4cc85deebff94b
  LEAN4EXPORT_REV: 076e8e57707e813375e8f9da8bf989799ace9680
  LANDRUN_REV: ec104f6edc1e14d7fec6d31146f1ec6f9c192c5a
  NANODA_REV: a3ef25a863f689d339277090588599dceb741149
jobs:
  comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: Check out openai/math (lean/ only)
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: ${{ inputs.commit }}
          path: oai
          sparse-checkout: lean
          fetch-depth: 1
      - name: Record environment
        run: |
          echo "OAI_SHA=$(git -C oai rev-parse HEAD)" >> "$GITHUB_ENV"
          uname -a; nproc; free -g
          cat /sys/kernel/security/lsm || true
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build landrun
        run: |
          set -euo pipefail
          git clone https://github.com/Zouuup/landrun tools/landrun
          git -C tools/landrun checkout --detach "$LANDRUN_REV"
          (cd tools/landrun && go build -o landrun cmd/landrun/main.go)
          echo "$GITHUB_WORKSPACE/tools/landrun" >> "$GITHUB_PATH"
      - name: Build comparator and lean4export with the target's toolchain
        run: |
          set -euo pipefail
          TC=$(cat oai/lean/lean-toolchain); echo "target toolchain: $TC"
          git clone https://github.com/leanprover/comparator tools/comparator
          git -C tools/comparator checkout --detach "$COMPARATOR_REV"
          git clone https://github.com/leanprover/lean4export tools/lean4export
          git -C tools/lean4export checkout --detach "$LEAN4EXPORT_REV"
          # Both read .olean files / export data of the target, so they must use its exact toolchain.
          echo "$TC" > tools/comparator/lean-toolchain
          echo "$TC" > tools/lean4export/lean-toolchain
          (cd tools/lean4export && lake build)
          (cd tools/comparator && lake build comparator)
          echo "$GITHUB_WORKSPACE/tools/lean4export/.lake/build/bin" >> "$GITHUB_PATH"
          echo "COMPARATOR_BIN=$GITHUB_WORKSPACE/tools/comparator/.lake/build/bin/comparator" >> "$GITHUB_ENV"
      - name: Build nanoda
        if: ${{ inputs.nanoda }}
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone https://github.com/ammkrn/nanoda_lib tools/nanoda
          git -C tools/nanoda checkout --detach "$NANODA_REV"
          (cd tools/nanoda && cargo build --release)
          echo "$GITHUB_WORKSPACE/tools/nanoda/target/release" >> "$GITHUB_PATH"
      - name: Fetch dependencies from the committed manifest and the Mathlib cache (no lake update)
        working-directory: oai/lean
        run: |
          set -euo pipefail
          git status --porcelain lake-manifest.json
          lake exe cache get
          # The manifest must be unchanged: we never re-resolve dependencies.
          git diff --exit-code lake-manifest.json
          du -sh .lake; df -h /
      - name: Apply openai/math's committed dependency patches (what its post_update hook does, without lake update)
        working-directory: oai/lean
        run: |
          set -euo pipefail
          # openai/math's lakefile.lean patches third-party dependencies from lean/patches/<label>-lean4341.patch.
          # 11 packages are patched at configuration time (already done by the lake call above); the 12 below are
          # patched only by its `post_update` hook, i.e. by `lake update`, which we do not run. We replay that hook:
          # same pinned commits (checked against the committed manifest), same patch files, same checks.
          manifest_rev() { python3 -c "import json,sys;print([p['rev'] for p in json.load(open('lake-manifest.json'))['packages'] if p['name']==sys.argv[1]][0])" "$1"; }
          for label in iut tate-curves-theta genl heights pi1 orbicurve-cores oka tempered-fundamental-groups elliptic-curves formal-schemes belyi \
                       fixed-point-theorems PrimeNumberTheoremAnd Zeta3Irrational rellich-kondrachov carleson StrongPNT AbsorptionCutoff AINTLIB ClassFieldTheory schoenflies-lean SphereEversion gromov; do
            dir=.lake/packages/$label; patch=$PWD/patches/$label-lean4341.patch
            head=$(git -C "$dir" rev-parse HEAD); want=$(manifest_rev "$label")
            [ "$head" = "$want" ] || { echo "::error::$label at $head, manifest pins $want"; exit 1; }
            if git -C "$dir" apply --check --reverse "$patch" 2>/dev/null; then
              echo "$label: patch already applied ($(sha256sum "$patch" | cut -c1-16))"
            else
              git -C "$dir" apply --check "$patch"
              git -C "$dir" apply "$patch"
              git -C "$dir" apply --check --reverse "$patch"
              echo "$label: applied patch ($(sha256sum "$patch" | cut -c1-16))"
            fi
          done
          git diff --exit-code lake-manifest.json
      - name: Probe systemd-run (README's AF_UNIX guard)
        id: sysd
        continue-on-error: true
        run: |
          sudo loginctl enable-linger "$USER"
          sleep 3
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          systemd-run --user --wait --pipe --collect --property=RestrictAddressFamilies=~AF_UNIX true
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: Comparator (published config)
        working-directory: oai/lean
        env:
          CONFIG: ${{ inputs.config }}
          SYSD: ${{ steps.sysd.outputs.ok }}
        run: |
          set -euo pipefail
          cat "$CONFIG"
          start=$(date +%s)
          if [ "$SYSD" = "1" ]; then
            echo "Running under systemd-run --user with RestrictAddressFamilies=~AF_UNIX"
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            systemd-run --user --wait --pipe --collect --property=RestrictAddressFamilies=~AF_UNIX \
              -E PATH="$PATH" --working-directory "$(pwd)" -- \
              bash -c "lake env '$COMPARATOR_BIN' '$CONFIG'" 2>&1 | tee ../../comparator.log
          else
            echo "::warning::systemd-run unavailable; running comparator under landrun only"
            lake env "$COMPARATOR_BIN" "$CONFIG" 2>&1 | tee ../../comparator.log
          fi
          echo "wall time: $(( $(date +%s) - start )) s" | tee -a ../../comparator.log
      - name: Comparator with nanoda (second kernel)
        if: ${{ inputs.nanoda }}
        continue-on-error: true
        working-directory: oai/lean
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          command -v nanoda_bin
          python3 - "$CONFIG" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1])); c["enable_nanoda"] = True
          json.dump(c, open(sys.argv[1].replace(".json", ".nanoda.json"), "w"), indent=2)
          PY
          cfg="${CONFIG%.json}.nanoda.json"; cat "$cfg"
          start=$(date +%s)
          lake env "$COMPARATOR_BIN" "$cfg" 2>&1 | tee ../../comparator-nanoda.log
          echo "wall time: $(( $(date +%s) - start )) s" | tee -a ../../comparator-nanoda.log
      - name: Axiom audit and closure scan
        if: success() || failure()
        working-directory: oai/lean
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          mod=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['solution_module'])" "$CONFIG")
          python3 -c "import json,sys;print('\n'.join(json.load(open(sys.argv[1]))['theorem_names']))" "$CONFIG" > ../../theorems.txt
          lake build "$mod" 2>&1 | tail -n 5
          : > ../../audit.log
          while read -r thm; do
            "$GITHUB_WORKSPACE/harness/scripts/axiom_audit.sh" . "$mod" "$thm" 0 | tee -a ../../audit.log
          done < ../../theorems.txt
          python3 -I "$GITHUB_WORKSPACE/harness/scripts/closure_scan.py" . "$mod" | tee ../../scan.log
      - name: Summary
        if: always()
        run: |
          {
            echo "## Comparator on openai/math"
            echo "- Commit: $OAI_SHA"
            echo "- Config: ${{ inputs.config }}"
            echo "- Toolchain: $(cat oai/lean/lean-toolchain)"
            echo "- Mathlib: $(grep -A8 '"name": "mathlib"' oai/lean/lake-manifest.json | grep -E '"rev"' | tr -d ' \n')"
            echo "- Comparator $COMPARATOR_REV, lean4export $LEAN4EXPORT_REV, landrun $LANDRUN_REV, nanoda $NANODA_REV"
            echo '```'
            tail -n 15 comparator.log 2>/dev/null || echo "(no comparator log)"
            echo '--- nanoda'
            tail -n 15 comparator-nanoda.log 2>/dev/null || echo "(no nanoda log)"
            echo '--- axioms'
            grep -h AXIOMS audit.log 2>/dev/null || echo "(no audit output)"
            echo '--- closure scan'
            grep -hE '^(CLOSURE|  |SCAN_HITS)' scan.log 2>/dev/null || echo "(no scan output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparator-logs
          path: |
            comparator.log
            comparator-nanoda.log
            audit.log
            scan.log
